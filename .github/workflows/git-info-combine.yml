name: Git-info-combine

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: git-info-combine
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Git-info-combine is private for now, so check it out with the token
      # and run it from a local path. Once it is public, replace these two
      # steps with: uses: Kingpin-Apps/git-info-combine@v1
      - uses: actions/checkout@v7
        with:
          repository: Kingpin-Apps/git-info-combine
          token: ${{ secrets.GIC_GITHUB_TOKEN }}
          path: .git-info-combine
          persist-credentials: false
      - uses: ./.git-info-combine
        with:
          github-token: ${{ secrets.GIC_GITHUB_TOKEN }}
          gitlab-token: ${{ secrets.GIC_GITLAB_TOKEN }}
          wakatime-api-key: ${{ secrets.GIC_WAKATIME_KEY }}
          cards: heatmap,stats,languages,wakatime,pins
          languages-hide: Untyped Plutus Core
          wakatime-hide: Other
          pins: |
            KINGH242/pccontext
            Kingpin-Apps/swift-cardano-core
            Kingpin-Apps/swift-cardano-multitool
            Kingpin-Apps/swift-package-compat-check
