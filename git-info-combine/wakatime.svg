<svg xmlns="http://www.w3.org/2000/svg" width="450" height="273" viewBox="0 0 450 273" fill="none" role="img" aria-labelledby="title desc"><title id="title">WakaTime Stats</title><desc id="desc">31 hrs 56 mins in the last 7 days. Swift 17 hrs 22 mins, Markdown 11 hrs 58 mins, YAML 1 hr 21 mins, Bash 39 mins, Icon 27 mins, Text 3 mins</desc><style>svg{--title:#0969da;--icon:#0969da;--text:#59636e;--bg:#ffffff;--border:#d1d9e0}@media (prefers-color-scheme: dark){svg{--title:#4493f8;--icon:#4493f8;--text:#9198a1;--bg:#0d1117;--border:#3d444d}}.bg{fill:var(--bg);stroke:var(--border)}.title{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:var(--title)}.text{font:400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:var(--text)}.small{font:400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:var(--text)}.bold{font-weight:700}.icon{fill:var(--icon)}</style><rect class="bg" x="0.5" y="0.5" rx="4.5" width="449" height="272"/><text class="title" x="25" y="35">WakaTime Stats</text><g transform="translate(0 68)"><text class="small" x="25" y="0">31 hrs 56 mins in the last 7 days</text><text class="small" x="25" y="30">Swift</text><text class="small" x="425" y="30" text-anchor="end">17 hrs 22 mins</text><rect x="160" y="21" width="170" height="8" rx="4" fill="var(--text)" fill-opacity="0.15"/><rect x="160" y="21" width="41.51" height="8" rx="4" fill="#F05138"/><text class="small" x="25" y="60">Markdown</text><text class="small" x="425" y="60" text-anchor="end">11 hrs 58 mins</text><rect x="160" y="51" width="170" height="8" rx="4" fill="var(--text)" fill-opacity="0.15"/><rect x="160" y="51" width="28.63" height="8" rx="4" fill="#083fa1"/><text class="small" x="25" y="90">YAML</text><text class="small" x="425" y="90" text-anchor="end">1 hr 21 mins</text><rect x="160" y="81" width="170" height="8" rx="4" fill="var(--text)" fill-opacity="0.15"/><rect x="160" y="81" width="3.26" height="8" rx="4" fill="#cb171e"/><text class="small" x="25" y="120"